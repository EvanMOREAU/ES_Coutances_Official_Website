# nginx devant le conteneur PHP-FPM (voir compose.prod.example.yaml). Le TLS est terminé en amont (reverse proxy / hébergeur).
server {
    listen 80;
    root /var/www/escoutances/public;
    index index.php;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|bak|old|orig|log|dist|lock)$ { deny all; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        expires 30d;
        location ~ \.php$ { return 403; }
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /media/cache/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ { return 404; }
}
