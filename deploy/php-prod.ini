; Réglages PHP recommandés en production (PHP-FPM). À copier dans le dossier conf.d de PHP
; (ex. /etc/php/8.4/fpm/conf.d/90-escoutances.ini). Le Dockerfile l'installe automatiquement.

expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
zend.assertions = -1

; Cookie de session : inaccessible au JavaScript, jamais envoyé en HTTP simple, SameSite=Lax
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; OPcache : le code compilé reste en mémoire. La date des fichiers est revérifiée toutes les 10 s
; (nécessaire car « Administration > Mise à jour » remplace le code sans redémarrer PHP-FPM).
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
opcache.save_comments = 1

; Résolution des chemins de fichiers : évite des milliers d'appels système par requête
realpath_cache_size = 4096K
realpath_cache_ttl = 600
