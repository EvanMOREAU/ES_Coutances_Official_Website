# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.timezone: 'Europe/Paris'
    app.maintenance_flag_path: '%env(MAINTENANCE_FLAG_PATH)%'
    app.mailer_from_address: '%env(MAILER_FROM_ADDRESS)%'
    app.mailer_from_name: '%env(MAILER_FROM_NAME)%'
    # Branche Git suivie par le déploiement automatique (vide = branche actuellement extraite).
    env(DEPLOY_BRANCH): ''
    app.deploy_branch: '%env(DEPLOY_BRANCH)%'
    # Quota affiché par le gestionnaire de fichiers (en Mo).
    env(FILES_QUOTA_MB): '10240'
    app.files_quota_mb: '%env(FILES_QUOTA_MB)%'

    # Double authentification obligatoire pour les comptes développeur et administrateur (0 pour la suspendre).
    env(ENFORCE_PRIVILEGED_2FA): '1'

    # Informations des pages légales (voir LegalController) ; à renseigner dans .env.local.
    env(LEGAL_PUBLICATION_DIRECTOR): ''
    env(LEGAL_ASSOCIATION_ID): ''
    env(LEGAL_HOST): ''
    env(LEGAL_CONSUMER_MEDIATOR): ''
    # Mention de TVA des factures de la boutique : à confirmer avec le trésorier / l'expert-comptable.
    env(LEGAL_VAT_MENTION): 'TVA non applicable, article 293 B du CGI'
    env(LEGAL_DPO_CONTACT): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $maintenanceFlagPath: '%app.maintenance_flag_path%'
            string $mailerFromAddress: '%app.mailer_from_address%'
            string $mailerFromName: '%app.mailer_from_name%'
            string $projectDir: '%kernel.project_dir%'
            string $deployBranch: '%app.deploy_branch%'
            string $kernelEnvironment: '%kernel.environment%'
            string $filesQuotaMb: '%app.files_quota_mb%'
            string $secret: '%kernel.secret%'
            bool $debug: '%kernel.debug%'
            bool $privilegedTwoFactorEnforced: '%env(bool:ENFORCE_PRIVILEGED_2FA)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
