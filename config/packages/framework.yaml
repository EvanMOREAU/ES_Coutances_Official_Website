# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    fragments:
        enabled: true
    # Note that the session will be started ONLY if you read or write from it.
    session: true
    default_locale: fr
    #esi: true
    #fragments: true

    # Limitation des envois sur les formulaires publics (voir App\EventListener\PublicFormThrottleListener).
    # Fenêtre glissante par adresse IP : au-delà, la requête reçoit un 429.
    rate_limiter:
        public_contact:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        public_registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        public_reset_password:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        public_cart:
            policy: sliding_window
            limit: 120
            interval: '5 minutes'
        public_webhook:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
