framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: es_messenger_messages
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    table_name: es_messenger_messages
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Les emails partent en synchrone (pas de worker à maintenir pour un
            # club) : pour repasser en file d'attente, router SendEmailMessage vers "async"
            # et lancer "php bin/console messenger:consume async".
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            # E-mails envoyés par un worker quand MAILER_ASYNC=1 (voir App\Mail\DynamicMailer)
            App\Message\QueuedEmail: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
