security:
    role_hierarchy:
        ROLE_DEV:    [ROLE_ADMIN, ROLE_EDITOR, ROLE_USER]
        ROLE_ADMIN:  [ROLE_EDITOR, ROLE_USER]
        ROLE_EDITOR: ROLE_USER
        # Comptes du portail familles/licenciés (espace /mon-compte), distincts
        # des comptes de gestion du site (ROLE_EDITOR/ROLE_ADMIN/ROLE_DEV).
        ROLE_FAMILLE:  ROLE_USER
        ROLE_LICENCIE: ROLE_USER

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/admin
            context: app_user_context
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\Webauthn\PasskeyAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: admin
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                prepare_on_login: true
                prepare_on_access_denied: true
                enable_csrf: true

        main:
            context: app_user_context
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\Webauthn\PasskeyAuthenticator
            form_login:
                login_path: portail_login
                check_path: portail_login
                default_target_path: portail_index
                username_parameter: email
                password_parameter: password
            logout:
                path: portail_logout
                target: app_home
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            two_factor:
                auth_form_path: portail_2fa_login
                check_path: portail_2fa_login_check
                prepare_on_login: true
                prepare_on_access_denied: true
                enable_csrf: true

    access_control:
        # La déconnexion doit rester possible pendant la double authentification (sinon « Annuler et se déconnecter » ne fait rien).
        - { path: ^/admin/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/mon-compte/deconnexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/webauthn/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/(2fa$|2fa_check$|2fa/resend-email$), roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_EDITOR }
        - { path: ^/mon-compte/(2fa$|2fa_check$|2fa/resend-email$), roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/mon-compte/webauthn/login, roles: PUBLIC_ACCESS }
        - { path: ^/mon-compte/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/mon-compte/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/mon-compte, roles: ROLE_USER }