# Journal des modifications du site (page « Changelog » de l'administration, réservée aux développeurs).
#
# Ce fichier est versionné avec le code : à chaque mise à jour, ajoutez une entrée EN HAUT de la liste.
# Au déploiement, la page se met à jour toute seule, rien à saisir en base de données.
#
# Chaque version :
#   version : numéro (ex. 1.2.0)      date : AAAA-MM-JJ      titre : résumé court (facultatif)
#   added / improved / fixed / removed : listes de phrases (Ajouté / Amélioré / Corrigé / Retiré)

- version: "1.0.8"
  date: "2026-10-07"
  titre: "Fiabilisation : 300 tests automatisés, contrôle qualité du code, formulaires sécurisés et pages d'erreur du club"
  added:
    - "Plus de 300 tests automatisés couvrant la boutique (panier, commande, stock, bons de livraison), les connexions, l'import Foot Club, le RGPD (export et anonymisation), la messagerie et le support, le planning, le formulaire de contact, la clôture de saison, les droits d'accès et l'administration."
    - "Tests de masse : toutes les pages de l'administration et de l'espace Mon compte sont vérifiées (inaccessibles sans connexion, refusées sans l'autorisation requise, jamais d'erreur serveur), et chaque formulaire de création est envoyé à vide pour détecter toute validation oubliée."
    - "Contrôle qualité du code en une commande (composer check) : style du code, validation des fichiers de configuration et des templates, analyse statique PHPStan et tests. Un contrôle plus rapide peut s'activer avant chaque commit (composer hooks:install)."
    - "Intégration continue GitHub : à chaque modification, le style, l'analyse, la recherche de failles connues dans les dépendances et la suite de tests sont lancés automatiquement sur une base de données vierge, avec rejeu de toutes les migrations. Mises à jour de dépendances proposées chaque semaine."
    - "Garde-fou de base de données : un test échoue si une fiche (entité) est modifiée sans migration associée."
    - "Pages d'erreur aux couleurs du club (page introuvable, accès refusé, service indisponible, erreur générique) avec retour à l'accueil, sans aucune information technique."
    - "En-têtes de sécurité sur toutes les réponses du site (détection de type de fichier désactivée, protection contre l'inclusion du site dans un autre domaine, référent limité, fonctions matérielles inutiles désactivées, HSTS en HTTPS)."
    - "Adresse de supervision /health : répond 200 si le site et la base de données fonctionnent, 503 sinon, pour brancher un outil de surveillance."
    - "README : nouvelle section « Qualité du code et tests » (commandes, organisation des tests, règle pour protéger une nouvelle page)."
  fixed:
    - "Quatorze formulaires d'administration affichaient une erreur 500 quand ils étaient envoyés incomplets (équipes, saisons, articles, licenciés, familles, utilisateurs, membres, partenaires, catégories, offres d'emploi, pages, cartes « Nous rejoindre », slides du carousel). Ils affichent désormais un message clair et rien n'est enregistré."
    - "Le statut, l'ordre d'affichage, le prix d'un article et la catégorie d'âge d'un licencié ne provoquent plus d'erreur lorsque le champ est vide."
    - "Export CSV du journal d'activité : suppression d'un avertissement de PHP 8.5 sur la fonction d'écriture CSV."
    - "Offres d'emploi : suppression d'une propriété inexistante initialisée à la création (déprécié depuis PHP 8.2)."
  improved:
    - "Style du code uniformisé sur l'ensemble du projet (imports triés et nettoyés, apostrophes, virgules finales) sans changement de comportement."
    - "Les tests utilisent une base de données et un serveur d'e-mail factices : aucun e-mail réel n'est envoyé, aucune donnée de production n'est touchée."
    - "Dépendances mises à jour (Symfony 8.1.8, Doctrine ORM 3.7, Twig 3.29, Monolog, PHPUnit 13.4, vich/uploader-bundle 3.0) : le site n'affiche plus d'avertissement de fonctionnalité obsolète, à l'exception de deux messages internes au bundle d'envoi de fichiers (vich), qui disparaîtront à sa prochaine version."
    - "Requêtes Doctrine modernisées : jointure sur entité écrite avec ON (messagerie, compteur de messages non lus) et tris déclarés avec SortDirection (relations des fiches et toutes les requêtes des repositories, formulaires et services) au lieu de 'ASC'/'DESC' en texte."
    - "Menu de l'administration : la macro Twig nav_link reçoit des valeurs par défaut pour ses arguments facultatifs (plus d'une centaine d'avertissements Twig 3.29 supprimés dans le profiler), sans changement d'affichage."
    - "Cette mise à jour ne contient aucune migration de base de données."

- version: "1.0.7"
  date: "2026-10-06"
  titre: "Espace Mon compte refait et sécurisé, RGPD, support client, documents en messagerie, notifications et match en live programmé"
  added:
    - "Espace Mon compte : nouvelle page Paramètres avec Profil (nom, adresse e-mail changeable avec le mot de passe actuel, mot de passe, photo de profil), Sécurité, Notifications, Apparence et Confidentialité. Les comptes clients de la boutique n'ont pas de photo de profil ; familles et licenciés la gardent."
    - "Espace Mon compte : sécurité renforcée avec application d'authentification, code par e-mail, codes de secours et clés d'accès (passkeys), y compris la connexion par clé d'accès depuis la page de connexion."
    - "Espace Mon compte : personnalisation de l'affichage comme dans l'administration (thème clair, sombre ou système, couleur d'accent, densité, langue)."
    - "RGPD : téléchargement d'un récapitulatif de toutes les données du compte (version lisible/imprimable et version JSON), et suppression du compte par la personne elle-même. La suppression efface les données personnelles (profil, coordonnées, famille, licenciés, messages, documents, clés d'accès) mais conserve les factures (licences, règlements, commandes) sans lien avec l'identité."
    - "RGPD : le club peut anonymiser un compte (famille, licencié ou client) à la demande de la personne, depuis la fiche famille et la fiche commande (autorisation « Utilisateurs — supprimer »)."
    - "Préférences de notification détaillées pour chaque compte : cloche de l'administration et e-mail, séparément pour les messages, le planning, les commandes, les familles, les licenciés, les nouveaux comptes et les conseils (selon les autorisations du compte). Tout est activé par défaut ; les e-mails de la boutique (confirmation, paiement, retrait) et de sécurité restent toujours envoyés."
    - "Nouvelles notifications : nouveaux licenciés, nouveaux comptes, prochains événements du planning et messages non lus dans la cloche ; e-mails automatiques pour une nouvelle commande, famille, licencié, compte ou un nouvel événement du planning (un seul e-mail récapitulatif lors d'un import ou d'une création en série)."
    - "Support client : les comptes boutique (clients) disposent d'un onglet « Support » pour écrire au club. Ils n'ont qu'un seul interlocuteur, « Support ES Coutances », sans pouvoir ouvrir d'autre discussion."
    - "Nouvelle autorisation « Support client » : toute personne du club qui la détient répond aux clients depuis la messagerie, avec la trace de chaque réponse. Le client ne voit jamais le nom de l'agent, seulement « Support »."
    - "Messagerie admin : la liste est séparée en deux rubriques, « Discussions » (environ cinq visibles) et « Clients » ; le destinataire d'un client est désigné « Client » dans « Nouvelle discussion »."
    - "Messagerie : envoi de documents (trombone ou glisser-déposer), disponibles 14 jours dans la discussion. Un fichier envoyé depuis l'appareil rejoint l'espace de l'expéditeur puis est supprimé à l'échéance ; un document déjà présent dans son espace peut être partagé sans être supprimé. L'historique garde la trace de l'échange (« Document supprimé le… »)."
    - "Messagerie : les documents sont placés en attente dans la zone de saisie et ne partent qu'après un clic sur « Envoyer » ; un clic sur un document ouvre un aperçu dans le site (lecteur PDF, images, texte)."
    - "Messagerie : e-mail de notification aux personnes qui reçoivent un message sans être connectées (au plus un par discussion et par quart d'heure) ; commande « app:messagerie:purger-documents » pour supprimer les documents périmés."
    - "Messagerie : les pastilles de messages non lus se mettent à jour en direct sur toutes les pages (espace Mon compte, administration, site public), sans rechargement."
    - "Messagerie de support : les messages des autres membres de l'équipe apparaissent en bleu ; les siens gardent la couleur du thème."
    - "Match en live : plage horaire (début et fin) pendant laquelle le site affiche automatiquement le match « en direct » dans la barre de navigation. Réglable depuis « Match en live » et depuis « Bannière d'accueil », où une case permet aussi d'activer le direct immédiatement avec le lien de la bannière."
    - "Gestionnaire de fichiers : nouvelle rubrique « Fichiers inutilisés » listant les fichiers envoyés qu'aucune fiche du site n'utilise, avec un bouton pour tous les supprimer et libérer de l'espace."
    - "Gestionnaire de fichiers : dossier personnel par compte dans « Documents » ; chacun ne voit que le sien, sauf autorisation « Voir les documents personnels des autres comptes »."
    - "Partenaires : fiche de lecture d'un contrat (accessible depuis la fiche du partenaire), avec un bouton « Modifier le contrat » réservé aux comptes autorisés."
    - "Barre de navigation du site : lien « Se connecter », puis « Mon compte » et « Déconnexion » une fois connecté, sur toutes les pages."
    - "Messagerie : un compte anonymisé ne peut plus se connecter ; les discussions d'un compte supprimé sont effacées avec ses documents hébergés."
    - "Administration : « Notifications » (ex-« Préférences ») dans les paramètres du compte, avec un réglage cloche / e-mail par rubrique ; la messagerie respecte le choix « e-mail » pour les nouveaux messages."
    - "Mise en production : la commande « app:messagerie:purger-documents » peut être planifiée (cron) pour supprimer chaque jour les documents de messagerie arrivés à échéance ; elle est aussi appliquée à l'ouverture d'une discussion."
  improved:
    - "Paiement des licences : une fois un règlement encaissé ou une aide reçue, la ligne devient définitive (mode, montant, date de remise en banque, référence, date de réception) et ne peut plus être modifiée ni retirée ; il faut donc renseigner la référence du chèque avant de valider."
    - "Déconnexion : « Annuler et se déconnecter » fonctionne désormais aussi pendant la saisie du code de double authentification (administration et espace Mon compte)."
    - "Espace Mon compte entièrement redessiné : style clair et épuré aux couleurs du club (barre de navigation avec page active, accueil avec raccourcis, licenciés en cartes, prochains rendez-vous, factures et commandes plus lisibles), pages de connexion et d'inscription comprises."
    - "Page de connexion : le titre « Espace Familles & Licenciés » devient « Mon compte », puisque n'importe qui peut créer un compte pour commander ; la déconnexion ramène à l'accueil du site."
    - "Gestionnaire de fichiers : « Images » regroupe désormais toutes les images du site (thème, articles, avatars, bannière…) et « Fichiers » uniquement les fichiers qui ne sont pas des images, chacun n'acceptant que son type de contenu."
    - "Partenaires : un règlement encaissé et une tâche faite deviennent définitifs et ne peuvent plus être modifiés ni retirés (type, montant, dates, référence, libellé…)."
    - "Page Support : le logo du club remplace l'initiale à la place de la photo de profil, la page tient à l'écran sans défilement, et un message rappelle que les réponses peuvent prendre du temps et sont signalées par e-mail."
    - "Compteur de messages non lus d'un client : il ne tient plus compte de ses anciennes discussions, invisibles depuis l'onglet Support."
    - "Comptes hors équipe (familles, licenciés, clients) : l'apparence reste claire par défaut, comme avant l'arrivée des réglages d'apparence ; le thème sombre est un choix du compte."
    - "Site vitrine : la carte « Match en live » et le tableau de bord tiennent compte de la plage horaire programmée, pas seulement de l'activation manuelle."
    - "Messagerie : les comptes clients ne voient que leur discussion de support ; les nouveaux messages d'un client préviennent par e-mail les membres du support hors ligne."
  fixed:
    - "Boutique : un article ne peut plus avoir un prix nul ; le prix doit être d'au moins 0,01 €."
    - "Administration : l'envoi d'un fichier provoquait une erreur 500 dans la réponse (le fichier était pourtant enregistré), à cause du journal d'audit qui lisait la taille d'un fichier déjà déplacé."
    - "Messagerie : la zone de saisie pouvait s'afficher beaucoup trop haute lorsqu'elle était mesurée avant d'être affichée."
    - "Double authentification : l'écran de saisie du code de l'espace Mon compte reprend les couleurs du compte, et le lien « Annuler et se déconnecter » ne renvoie plus vers l'écran du code."

- version: "1.0.6"
  date: "2026-10-01"
  titre: "Gestion des partenaires, assistants de création et planning"
  added:
    - "Nouvelle catégorie « Partenaires » dans le menu : tableau de bord dédié (montant total des contrats, reste à encaisser, partenaires en impayé, tâches en attente, évolution du nombre de partenaires)."
    - "Création d'un partenaire sous forme d'assistant en 5 étapes : informations, premier contrat (dates, montant, document), règlements, tâches et notes."
    - "Catégories de partenaires (ex. Or, Argent, Fournisseur…), définies depuis la rubrique Développeur et proposées sur chaque partenaire."
    - "Déploiement : l'historique affiche désormais toutes les mises à jour déployées, avec pagination, au lieu des 10 dernières seulement."
    - "Planning : un événement interne peut être partagé à un ou plusieurs comptes précis, en plus de « tout le monde » et d'un groupe précis."
    - "Paiement d'une licence : création sous forme d'assistant en 4 étapes (licence et montant, aides, règlements, observations) ; le reste à régler se recalcule automatiquement avec les aides, et toute saisie dépassant le montant de la licence est bloquée tant qu'elle n'est pas corrigée."
    - "Paiement d'une licence : possibilité de créer une licence pour une personne pas encore enregistrée comme licencié (simple nom), à rattacher plus tard à une fiche licencié."
    - "Fiche de lecture d'une licence (« Voir »), accessible depuis le menu « … » de la liste, avant de la modifier."
    - "Connexion sans mot de passe par clé d'accès (passkey) : enregistrement d'une ou plusieurs clés depuis Paramètres > Sécurité (Face ID, Windows Hello, clé de sécurité, gestionnaire de mots de passe comme Bitwarden…), et bouton dédié sur l'écran de connexion de l'administration."
    - "Notification de paiement HelloAsso : le site est désormais averti par HelloAsso dès qu'un paiement est confirmé, même si le client ferme l'onglet avant de revenir sur le site (l'URL à configurer côté HelloAsso est affichée dans Configuration > HelloAsso)."
  improved:
    - "Paiement d'une licence : le montant dû, le prix de la licence (supérieur à 0€) et le rattachement à un licencié sont désormais aussi vérifiés côté serveur, pas seulement dans l'assistant de création — toute tentative de contournement est rejetée avec le montant exact manquant."
    - "Boutique : un compte est désormais obligatoire pour valider une commande (catalogue et panier restent accessibles sans compte)."
    - "Boutique : pour un paiement par carte, l'e-mail de confirmation n'est plus envoyé à la création de la commande mais seulement une fois le paiement réellement validé par HelloAsso."
    - "Planning : le bouton « Ajouter une séance » devient « Ajouter un événement » ; l'ordre des types proposés est désormais Événement interne, Entraînement, Rencontre interne (événement interne sélectionné par défaut), et la mention trompeuse « réservé au back-office » a été retirée."
    - "Liste des commandes : l'onglet « À préparer » est sélectionné par défaut à l'ouverture de la page, au lieu de « Toutes »."
    - "La carte « Partenaires & sponsors » quitte la page « Site vitrine » pour rejoindre le nouveau tableau de bord « Partenaires »."
    - "Assistants de création d'un contrat partenaire et d'une licence : les lignes d'aides et de règlements ne se tronquent plus (largeur et grille corrigées)."
    - "Déploiement : si une mise à jour modifie l'outil de déploiement lui-même, le déploiement en cours peut encore échouer à l'étape « Dépendances PHP » (le processus continue avec l'ancien code déjà chargé en mémoire) — relancer « Déployer » une seconde fois suffit, le code étant alors déjà à jour sur le serveur."
  fixed:
    - "Création manuelle d'une famille : une erreur 500 se produisait si la date de naissance, l'email, le nom, le prénom ou la saison d'un licencié restait vide au lieu d'afficher une erreur de formulaire."
    - "Déploiement (rubrique Développeur) : le bouton restait bloqué indéfiniment sur « Démarrage » sans aucune erreur visible (le processus lancé en arrière-plan utilisait une version de PHP incompatible avec le site)."
    - "Déploiement : l'installation des dépendances (Composer) pouvait échouer pour la même raison de version de PHP."
    - "Déploiement : le paquet de compilation Tailwind était classé par erreur comme dépendance de développement, absente d'une installation de production."
    - "Déploiement : le binaire Tailwind téléchargé n'avait pas les droits d'exécution, faisant échouer la compilation des styles."
    - "Assistants de création (partenaire, licence) : la touche Entrée ne termine plus la création en cours de route, elle passe simplement à l'étape suivante."
    - "Création d'un article : une photo envoyée restait perdue si la publication était bloquée faute de taille renseignée, obligeant à la renvoyer ; elle est maintenant conservée et réutilisée automatiquement à l'envoi suivant."
    - "Clés d'accès (passkeys) : la page Paramètres > Sécurité refusait l'accès aux clés avec « Vous n'avez pas l'autorisation d'accéder à cette page » (nouvelles routes non déclarées dans le système d'autorisations)."
    - "Clés d'accès (passkeys) : l'ajout d'une clé échouait avec une erreur SQL (donnée binaire rejetée par la colonne de stockage)."
    - "Clés d'accès (passkeys) : le bouton « Se connecter avec une clé d'accès » restait sans effet sur l'écran de connexion (la page ne chargeait aucun script)."
    - "Paiement HelloAsso : un paiement par carte réellement abouti restait affiché comme « en attente » (le site vérifiait un champ absent de la réponse de l'API ; l'état réel du paiement est maintenant correctement lu)."

- version: "1.0.5"
  date: "2026-09-29"
  titre: "Codes promo, paiement HelloAsso, comptes boutique et double authentification"
  added:
    - "Codes de réduction pour la boutique (pourcentage ou montant fixe), avec activation, période de validité et quota d'utilisation, gérés depuis Configuration > Codes de réduction."
    - "Codes « bon de livraison » : un code peut, en plus (ou à la place) d'une réduction, autoriser la livraison — une étape dédiée demande alors l'adresse avant de valider la commande, au lieu du simple retrait au club."
    - "Commande boutique : le total se met à jour en direct dès la saisie d'un code de réduction, avant même de valider le formulaire."
    - "Paiement en ligne par carte via HelloAsso : redirection vers HelloAsso pour régler le montant exact de la commande, avec vérification du paiement auprès de HelloAsso au retour avant de l'enregistrer."
    - "Configuration (rubrique Développeur) : nouvelle page regroupant les paramètres techniques du site — e-mail, HelloAsso et catégories d'encadrement — avec une carte par réglage."
    - "N'importe qui peut créer librement un compte « boutique » (sans lien avec une famille, un licencié ou un compte du club) pour commander sur la boutique et retrouver l'historique de ses commandes."
    - "Double authentification (2FA) activable depuis Paramètres > Sécurité : application d'authentification (Google Authenticator, Bitwarden, 1Password…) avec QR code, code de vérification par e-mail, et codes de secours à usage unique en cas de perte d'accès."
    - "Écran de vérification en deux étapes à la connexion, avec choix de la méthode si plusieurs sont activées et lien pour utiliser un code de secours."
    - "Menu de l'administration : nouvelle catégorie « Développeur », visible uniquement pour les comptes développeur."
    - "Changelog : pastille « nouvelle version » dans le menu tant que la dernière version n'a pas été consultée."
  improved:
    - "Boutique : le paiement par carte doit désormais être finalisé en ligne (le règlement ne peut plus être reporté après validation de la commande)."
    - "Menu de l'administration : Paramètres e-mail et Catégories d'encadrement regroupés avec HelloAsso dans la nouvelle page Configuration, à la place de liens séparés dans « Administration »."
    - "Pages personnalisées du site vitrine (ex. « Nous rejoindre ») : un clic sur une image insérée dans le texte ouvre désormais un aperçu en grand sans quitter la page, au lieu de charger le fichier brut sans moyen simple de revenir en arrière."
    - "Pages personnalisées du site vitrine : les images insérées dans le texte s'adaptent à la largeur de l'écran, y compris sur mobile."
    - "Paramètres > Sécurité : mise en page alignée sur les autres onglets (espacements, plus de barre de défilement parasite)."
  fixed:
    - "Pages personnalisées du site vitrine : une image insérée dans le texte dont les proportions ne correspondaient pas à la largeur affichée apparaissait déformée (étirée ou écrasée)."
  removed:
    - "Déploiement, Journal d'activité et Changelog ne sont plus listés dans la catégorie « Administration » du menu (regroupés dans la nouvelle catégorie « Développeur »)."

- version: "1.0.4"
  date: "2026-09-28"
  titre: "Import fiabilisé et tableau de bord personnalisable"
  added:
    - "Import Foot Club : l'aperçu avant confirmation signale les regroupements de familles à risque (adresse différente de celle déjà enregistrée, licenciés jusqu'ici rattachés à des familles différentes) et permet de retirer un licencié d'une famille avant de confirmer ; aucune famille sans licencié ne peut plus être créée par l'import."
    - "Import Foot Club : correction après coup depuis le menu « … » d'un licencié (« Correction d'import ») pour le rattacher à la bonne famille ; l'ancienne famille est supprimée automatiquement si elle se retrouve sans aucun licencié."
    - "Familles : le prénom du parent référent s'affiche entre parenthèses devant le nom de famille, pour distinguer deux familles homonymes."
    - "Familles : indicateur (liste des familles + cloche de notifications) quand une famille n'a pas d'adresse e-mail exploitable."
    - "Liste des familles : nouvel onglet « Non conforme » regroupant les familles ayant un problème à corriger (ex. e-mail invalide)."
    - "Tableau de bord : personnalisation par modules — chaque utilisateur choisit les blocs affichés parmi ceux que ses autorisations permettent de voir, mémorisé automatiquement."
    - "Tableau de bord : nouveaux graphiques d'évolution du nombre de licenciés actifs et des ventes de la boutique."
  improved:
    - "Familles : le nom de famille et la ville sont désormais toujours enregistrés en majuscules, que ce soit à l'import ou à la saisie manuelle (les données déjà en base ont été mises à jour)."
    - "Tableau de bord : les blocs « Dernières familles / derniers licenciés / dernières équipes / dernières saisons » dépendent désormais des autorisations de l'utilisateur plutôt que du rôle administrateur."

- version: "1.0.3"
  date: "2026-09-28"
  titre: "Réorganisation par glisser-déposer et menu repliable"
  added:
    - "Partenaires/sponsors, slides du carousel et catégories d'encadrement : l'ordre d'affichage se règle désormais en glissant-déposant les lignes du tableau, plus besoin de saisir un numéro d'ordre."
    - "Menu latéral de l'administration : chaque catégorie (Licenciés, Boutique, Site vitrine…) peut être repliée ou dépliée ; le réglage est mémorisé dans le navigateur."
    - "Création d'un article : boutons « Enregistrer en brouillon » et « Publier » à la place du menu déroulant de statut (l'archivage reste réservé à la modification)."
    - "Catégories de la boutique (ex. T-shirts, Joggings) : se choisissent ou se créent à la volée directement depuis la fiche d'un article, avec détection des doublons (casse et accents ignorés)."
    - "Filtre par catégorie dans la boutique du site."
    - "Gestion des stocks : réassort en une fois, taille par taille, depuis le menu « … » d'un article (la quantité saisie s'ajoute au stock déjà en place)."
    - "Mise en maintenance de la boutique (rubrique Développeur) : masque la boutique aux visiteurs tout en restant visible pour les comptes développeur, avec un bandeau d'avertissement."
  improved:
    - "Fiche d'un article : l'affichage des tailles et du stock n'a plus de cases superflues autour des chiffres."
    - "Bandeau d'accueil de l'administration moins lumineux."
    - "Menu de l'administration : « Messagerie » repositionnée après la rubrique « Licenciés »."
