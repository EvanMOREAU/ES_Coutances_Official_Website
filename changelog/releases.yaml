# Journal des modifications du site (page « Changelog » de l'administration, réservée aux développeurs).
#
# Ce fichier est versionné avec le code : à chaque mise à jour, ajoutez une entrée EN HAUT de la liste.
# Au déploiement, la page se met à jour toute seule, rien à saisir en base de données.
#
# Chaque version :
#   version : numéro (ex. 1.2.0)      date : AAAA-MM-JJ      titre : résumé court (facultatif)
#   added / improved / fixed / removed : listes de phrases (Ajouté / Amélioré / Corrigé / Retiré)

- version: "1.0.6"
  date: "2026-10-01"
  titre: "Gestion des partenaires, assistants de création et planning"
  added:
    - "Nouvelle catégorie « Partenaires » dans le menu : tableau de bord dédié (montant total des contrats, reste à encaisser, partenaires en impayé, tâches en attente, évolution du nombre de partenaires)."
    - "Création d'un partenaire sous forme d'assistant en 5 étapes : informations, premier contrat (dates, montant, document), règlements, tâches et notes."
    - "Catégories de partenaires (ex. Or, Argent, Fournisseur…), définies depuis la rubrique Développeur et proposées sur chaque partenaire."
    - "Déploiement : l'historique affiche désormais toutes les mises à jour déployées, avec pagination, au lieu des 10 dernières seulement."
    - "Planning : un événement interne peut être partagé à un ou plusieurs comptes précis, en plus de « tout le monde » et d'un groupe précis."
    - "Paiement d'une licence : création sous forme d'assistant en 4 étapes (licence et montant, aides, règlements, observations) ; le reste à régler se recalcule automatiquement avec les aides, et toute saisie dépassant le montant de la licence est bloquée tant qu'elle n'est pas corrigée."
    - "Paiement d'une licence : possibilité de créer une licence pour une personne pas encore enregistrée comme licencié (simple nom), à rattacher plus tard à une fiche licencié."
    - "Fiche de lecture d'une licence (« Voir »), accessible depuis le menu « … » de la liste, avant de la modifier."
    - "Connexion sans mot de passe par clé d'accès (passkey) : enregistrement d'une ou plusieurs clés depuis Paramètres > Sécurité (Face ID, Windows Hello, clé de sécurité, gestionnaire de mots de passe comme Bitwarden…), et bouton dédié sur l'écran de connexion de l'administration."
    - "Notification de paiement HelloAsso : le site est désormais averti par HelloAsso dès qu'un paiement est confirmé, même si le client ferme l'onglet avant de revenir sur le site (l'URL à configurer côté HelloAsso est affichée dans Configuration > HelloAsso)."
  improved:
    - "Paiement d'une licence : le montant dû, le prix de la licence (supérieur à 0€) et le rattachement à un licencié sont désormais aussi vérifiés côté serveur, pas seulement dans l'assistant de création — toute tentative de contournement est rejetée avec le montant exact manquant."
    - "Boutique : un compte est désormais obligatoire pour valider une commande (catalogue et panier restent accessibles sans compte)."
    - "Boutique : pour un paiement par carte, l'e-mail de confirmation n'est plus envoyé à la création de la commande mais seulement une fois le paiement réellement validé par HelloAsso."
    - "Planning : le bouton « Ajouter une séance » devient « Ajouter un événement » ; l'ordre des types proposés est désormais Événement interne, Entraînement, Rencontre interne (événement interne sélectionné par défaut), et la mention trompeuse « réservé au back-office » a été retirée."
    - "Liste des commandes : l'onglet « À préparer » est sélectionné par défaut à l'ouverture de la page, au lieu de « Toutes »."
    - "La carte « Partenaires & sponsors » quitte la page « Site vitrine » pour rejoindre le nouveau tableau de bord « Partenaires »."
    - "Assistants de création d'un contrat partenaire et d'une licence : les lignes d'aides et de règlements ne se tronquent plus (largeur et grille corrigées)."
    - "Déploiement : si une mise à jour modifie l'outil de déploiement lui-même, le déploiement en cours peut encore échouer à l'étape « Dépendances PHP » (le processus continue avec l'ancien code déjà chargé en mémoire) — relancer « Déployer » une seconde fois suffit, le code étant alors déjà à jour sur le serveur."
  fixed:
    - "Création manuelle d'une famille : une erreur 500 se produisait si la date de naissance, l'email, le nom, le prénom ou la saison d'un licencié restait vide au lieu d'afficher une erreur de formulaire."
    - "Déploiement (rubrique Développeur) : le bouton restait bloqué indéfiniment sur « Démarrage » sans aucune erreur visible (le processus lancé en arrière-plan utilisait une version de PHP incompatible avec le site)."
    - "Déploiement : l'installation des dépendances (Composer) pouvait échouer pour la même raison de version de PHP."
    - "Déploiement : le paquet de compilation Tailwind était classé par erreur comme dépendance de développement, absente d'une installation de production."
    - "Déploiement : le binaire Tailwind téléchargé n'avait pas les droits d'exécution, faisant échouer la compilation des styles."
    - "Assistants de création (partenaire, licence) : la touche Entrée ne termine plus la création en cours de route, elle passe simplement à l'étape suivante."
    - "Création d'un article : une photo envoyée restait perdue si la publication était bloquée faute de taille renseignée, obligeant à la renvoyer ; elle est maintenant conservée et réutilisée automatiquement à l'envoi suivant."
    - "Clés d'accès (passkeys) : la page Paramètres > Sécurité refusait l'accès aux clés avec « Vous n'avez pas l'autorisation d'accéder à cette page » (nouvelles routes non déclarées dans le système d'autorisations)."
    - "Clés d'accès (passkeys) : l'ajout d'une clé échouait avec une erreur SQL (donnée binaire rejetée par la colonne de stockage)."

- version: "1.0.5"
  date: "2026-09-29"
  titre: "Codes promo, paiement HelloAsso, comptes boutique et double authentification"
  added:
    - "Codes de réduction pour la boutique (pourcentage ou montant fixe), avec activation, période de validité et quota d'utilisation, gérés depuis Configuration > Codes de réduction."
    - "Codes « bon de livraison » : un code peut, en plus (ou à la place) d'une réduction, autoriser la livraison — une étape dédiée demande alors l'adresse avant de valider la commande, au lieu du simple retrait au club."
    - "Commande boutique : le total se met à jour en direct dès la saisie d'un code de réduction, avant même de valider le formulaire."
    - "Paiement en ligne par carte via HelloAsso : redirection vers HelloAsso pour régler le montant exact de la commande, avec vérification du paiement auprès de HelloAsso au retour avant de l'enregistrer."
    - "Configuration (rubrique Développeur) : nouvelle page regroupant les paramètres techniques du site — e-mail, HelloAsso et catégories d'encadrement — avec une carte par réglage."
    - "N'importe qui peut créer librement un compte « boutique » (sans lien avec une famille, un licencié ou un compte du club) pour commander sur la boutique et retrouver l'historique de ses commandes."
    - "Double authentification (2FA) activable depuis Paramètres > Sécurité : application d'authentification (Google Authenticator, Bitwarden, 1Password…) avec QR code, code de vérification par e-mail, et codes de secours à usage unique en cas de perte d'accès."
    - "Écran de vérification en deux étapes à la connexion, avec choix de la méthode si plusieurs sont activées et lien pour utiliser un code de secours."
    - "Menu de l'administration : nouvelle catégorie « Développeur », visible uniquement pour les comptes développeur."
    - "Changelog : pastille « nouvelle version » dans le menu tant que la dernière version n'a pas été consultée."
  improved:
    - "Boutique : le paiement par carte doit désormais être finalisé en ligne (le règlement ne peut plus être reporté après validation de la commande)."
    - "Menu de l'administration : Paramètres e-mail et Catégories d'encadrement regroupés avec HelloAsso dans la nouvelle page Configuration, à la place de liens séparés dans « Administration »."
    - "Pages personnalisées du site vitrine (ex. « Nous rejoindre ») : un clic sur une image insérée dans le texte ouvre désormais un aperçu en grand sans quitter la page, au lieu de charger le fichier brut sans moyen simple de revenir en arrière."
    - "Pages personnalisées du site vitrine : les images insérées dans le texte s'adaptent à la largeur de l'écran, y compris sur mobile."
    - "Paramètres > Sécurité : mise en page alignée sur les autres onglets (espacements, plus de barre de défilement parasite)."
  fixed:
    - "Pages personnalisées du site vitrine : une image insérée dans le texte dont les proportions ne correspondaient pas à la largeur affichée apparaissait déformée (étirée ou écrasée)."
  removed:
    - "Déploiement, Journal d'activité et Changelog ne sont plus listés dans la catégorie « Administration » du menu (regroupés dans la nouvelle catégorie « Développeur »)."

- version: "1.0.4"
  date: "2026-09-28"
  titre: "Import fiabilisé et tableau de bord personnalisable"
  added:
    - "Import Foot Club : l'aperçu avant confirmation signale les regroupements de familles à risque (adresse différente de celle déjà enregistrée, licenciés jusqu'ici rattachés à des familles différentes) et permet de retirer un licencié d'une famille avant de confirmer ; aucune famille sans licencié ne peut plus être créée par l'import."
    - "Import Foot Club : correction après coup depuis le menu « … » d'un licencié (« Correction d'import ») pour le rattacher à la bonne famille ; l'ancienne famille est supprimée automatiquement si elle se retrouve sans aucun licencié."
    - "Familles : le prénom du parent référent s'affiche entre parenthèses devant le nom de famille, pour distinguer deux familles homonymes."
    - "Familles : indicateur (liste des familles + cloche de notifications) quand une famille n'a pas d'adresse e-mail exploitable."
    - "Liste des familles : nouvel onglet « Non conforme » regroupant les familles ayant un problème à corriger (ex. e-mail invalide)."
    - "Tableau de bord : personnalisation par modules — chaque utilisateur choisit les blocs affichés parmi ceux que ses autorisations permettent de voir, mémorisé automatiquement."
    - "Tableau de bord : nouveaux graphiques d'évolution du nombre de licenciés actifs et des ventes de la boutique."
  improved:
    - "Familles : le nom de famille et la ville sont désormais toujours enregistrés en majuscules, que ce soit à l'import ou à la saisie manuelle (les données déjà en base ont été mises à jour)."
    - "Tableau de bord : les blocs « Dernières familles / derniers licenciés / dernières équipes / dernières saisons » dépendent désormais des autorisations de l'utilisateur plutôt que du rôle administrateur."

- version: "1.0.3"
  date: "2026-09-28"
  titre: "Réorganisation par glisser-déposer et menu repliable"
  added:
    - "Partenaires/sponsors, slides du carousel et catégories d'encadrement : l'ordre d'affichage se règle désormais en glissant-déposant les lignes du tableau, plus besoin de saisir un numéro d'ordre."
    - "Menu latéral de l'administration : chaque catégorie (Licenciés, Boutique, Site vitrine…) peut être repliée ou dépliée ; le réglage est mémorisé dans le navigateur."
    - "Création d'un article : boutons « Enregistrer en brouillon » et « Publier » à la place du menu déroulant de statut (l'archivage reste réservé à la modification)."
    - "Catégories de la boutique (ex. T-shirts, Joggings) : se choisissent ou se créent à la volée directement depuis la fiche d'un article, avec détection des doublons (casse et accents ignorés)."
    - "Filtre par catégorie dans la boutique du site."
    - "Gestion des stocks : réassort en une fois, taille par taille, depuis le menu « … » d'un article (la quantité saisie s'ajoute au stock déjà en place)."
    - "Mise en maintenance de la boutique (rubrique Développeur) : masque la boutique aux visiteurs tout en restant visible pour les comptes développeur, avec un bandeau d'avertissement."
  improved:
    - "Fiche d'un article : l'affichage des tailles et du stock n'a plus de cases superflues autour des chiffres."
    - "Bandeau d'accueil de l'administration moins lumineux."
    - "Menu de l'administration : « Messagerie » repositionnée après la rubrique « Licenciés »."
    - "Boutique du site : présentation des articles modernisée (cartes, ombres, mise en avant du prix et de la catégorie)."
    - "Barres de défilement et flèches des champs numériques harmonisées dans toute l'administration, à la place de celles du navigateur."
  fixed:
    - "Formulaire d'un article : le champ stock de chaque taille était trop étroit pour être lisible ou modifiable ; il se saisit à nouveau au clavier ou avec les boutons −/+."
    - "Avertissements de dépréciation Symfony/VichUploaderBundle nettoyés (bascule des annotations obsolètes vers les attributs PHP)."

- version: "1.0.2"
  date: "2026-09-25"
  titre: "Autorisations, journal d'activité et paramètres e-mail"
  added:
    - "Système d'autorisations : plus de 60 autorisations (voir, créer, modifier, supprimer et actions particulières) sur les familles, licenciés, équipes, saisons, paiements, planning, boutique, site vitrine, fichiers, utilisateurs…"
    - "Profils d'autorisation prêts à attribuer (Secrétariat, Éducateur, Responsable boutique, Communication, Lecture seule…), ajustables utilisateur par utilisateur."
    - "Page « Utilisateurs et autorisations » avec une carte Utilisateurs et une carte Autorisations."
    - "Journal d'activité (développeurs) : chaque action et chaque modification avec l'utilisateur, l'adresse IP, le navigateur et les valeurs avant / après ; filtres, détail, historique d'un élément et export CSV."
    - "Paramètres e-mail : serveur SMTP, identifiants (mot de passe chiffré) et expéditeur réglables depuis l'administration, avec e-mail de test."
    - "Suivi du paiement d'une licence en fenêtre, étape par étape (règlements, aides, récapitulatif), depuis le menu « … » de la liste."
    - "Fiche de lecture d'un article, avec accès direct à la modification."
    - "Planning : affichage par mois, par semaine ou par jour."
    - "Activer / désactiver un article en un clic."
  improved:
    - "Règlements des licences : « Encaissé » devient un interrupteur, utilisable dès la création ; les aides passent avant les règlements."
    - "Autorisations : un interrupteur « Toutes les autorisations » (et un par rubrique) remplace les boutons de sélection."
    - "Photo d'un article : une croix sur l'aperçu remplace la case « Supprimer la photo »."
    - "Menus, boutons et cases d'actions groupées masqués quand l'utilisateur n'a pas l'autorisation correspondante."
  fixed:
    - "Échelonnement du paiement d'une licence : message explicite quand le prix est absent ou que tout est déjà couvert."
    - "Une erreur de syntaxe dans un script empêchait le chargement des contrôleurs de l'administration."

- version: "1.0.1"
  date: "2026-09-25"
  titre: "Paiement des licences, planning avancé et gestion des accès"
  added:
    - "Suivi des paiements des licences : montant dû, règlements échelonnés (espèces, carte, chèques), remises en banque et aides (Pass'Sport, Spot 50, Atout Normandie, Bourse Évasion, chèques vacances, coupons sport)."
    - "Planning : équipes par catégorie et rencontres internes entre deux équipes du club."
    - "Fiche licencié en lecture seule, ouverte d'un clic sur la ligne ou depuis le menu « … »."
    - "Renvoi de l'e-mail de création de mot de passe depuis la liste des licenciés."
    - "Import : page dédiée dans l'administration."
    - "Couleur rouge du club, désormais la couleur par défaut."
  improved:
    - "Sélecteurs d'heure et de date plus fluides, animations des boutons allégées."
    - "Horaires d'ouverture : sélection guidée au lieu d'une saisie de texte."
    - "Messagerie : liste des participants d'un groupe en cliquant sur son nom."
    - "Activation et désactivation en un clic (sponsors, offres d'emploi, carousel, cartes « Nous rejoindre »)."
  fixed:
    - "Suppression d'une famille : plus d'erreur due aux demandes de mot de passe."
    - "Un seul menu ouvert à la fois dans la barre du haut."
  removed:
    - "Certificat médical et autorisation parentale : ne sont plus gérés dans l'application."

- version: "1.0.0"
  date: "2026-09-25"
  titre: "Boutique, planning et notifications"
  added:
    - "Boutique du club : articles avec tailles et stock, panier, commande avec retrait au club, suivi et paiement carte simulé."
    - "Planning des entraînements par catégorie, visible dans l'espace licencié."
    - "Notifications : marquer comme lue, supprimer, page dédiée."
