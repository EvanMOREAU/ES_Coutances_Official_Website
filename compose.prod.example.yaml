# Exemple de déploiement par conteneurs (à adapter) : PHP-FPM, nginx, MariaDB et le worker des e-mails.
#   cp compose.prod.example.yaml compose.prod.yaml   puis renseigner les secrets dans .env.prod (jamais versionné)
#   docker compose -f compose.prod.yaml up -d --build
# Les fichiers envoyés (uploads) et les sauvegardes vivent dans des volumes : à sauvegarder hors du serveur.
services:
  php:
    build: .
    env_file: .env.prod
    environment:
      MAILER_ASYNC: "1"
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    volumes:
      - uploads:/var/www/escoutances/public/uploads
      - private:/var/www/escoutances/var/private
      - backups:/var/www/escoutances/var/backups
      - assets:/var/www/escoutances/public/assets
      - media:/var/www/escoutances/public/media
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env.prod
    environment:
      MAILER_ASYNC: "1"
      REDIS_URL: redis://redis:6379
      SKIP_BOOT: "1"
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    restart: unless-stopped
    depends_on:
      - php

  # Cache applicatif, limiteurs de débit et sessions (REDIS_URL). Données jetables : pas de volume.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/escoutances/public/uploads:ro
      - assets:/var/www/escoutances/public/assets:ro
      - media:/var/www/escoutances/public/media
    depends_on:
      - php

  database:
    image: mariadb:10.11
    env_file: .env.prod
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/mysql

volumes:
  database:
  uploads:
  private:
  backups:
  assets:
  media:
